<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <!-- Header introducing the quiz -->
        <header>
            <h1>Web Development Quiz</h1>
            <p>Test your HTML, CSS, and JavaScript knowledge!</p>
        </header>

        <!-- Main section for questions, options, timer, and feedback -->
        <main>
            <section id="quiz-section">
                <div class="status-bar">
                    <span id="question-counter">Question 1 of 5</span>
                    <span id="timer">Time Left: 15s</span>
                </div>

                <h2 id="question-text">Loading question...</h2>

                <div id="options-container" class="options-grid">
                    <!-- Answer options injected dynamically by JS -->
                </div>
            </section>

            <!-- Feedback section -->
            <section id="feedback-section" class="feedback hidden"></section>

            <!-- Navigation & submission buttons -->
            <section class="controls">
                <button id="submit-btn" onclick="checkAnswer()" disabled>Submit Answer</button>
                <button id="next-btn" onclick="nextQuestion()" class="hidden">Next Question</button>
                <button id="restart-btn" onclick="startQuiz()" class="hidden">Restart Quiz</button>
            </section>
        </main>

        <!-- Footer displaying final score -->
        <footer id="score-footer">
            <p id="score-display">Current Score: 0</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
