<!DOCTYPE html>
<html lang="en">
<head>
    <title>Interactive Contact Form & Calculator</title>
</head>
<body>

    <!-- 1. Header Section -->
    <div id="header">
        <h1>Interactive Web Portal</h1>
        <span>Connecting Users &amp; Providing Instant Solutions</span>
    </div>

    <hr>

    <!-- 2. Content Section -->
    <div id="content">

        <!-- Form Subsection -->
        <div id="form-section">
            <h2>Contact Us</h2>
            <form action="#">
                <label for="email">User Email:</label><br>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required>
                <br><br>

                <label for="contact-date">Preferred Contact Date:</label><br>
                <input type="date" id="contact-date" name="contactDate" required>
                <br><br>

                <label for="satisfaction">Satisfaction Level (1 to 10):</label><br>
                <input type="range" id="satisfaction" name="satisfaction" min="1" max="10" value="5">
                <br><br>

                <input type="submit" value="Submit Form">
            </form>
        </div>

        <br>

        <!-- Dynamic Calculator Subsection -->
        <div id="calculator-section">
            <h2>Inline Addition Calculator</h2>
            <form oninput="sum.value = (parseFloat(num1.value) || 0) + (parseFloat(num2.value) || 0)">
                <label for="num1">First Number:</label>
                <input type="number" id="num1" name="num1" value="0">
                
                &plus;
                
                <label for="num2">Second Number:</label>
                <input type="number" id="num2" name="num2" value="0">
                
                &equals;
                
                <output name="sum" for="num1 num2">0</output>
            </form>
        </div>

    </div>

    <hr>

    <!-- 3. Footer Section -->
    <div id="footer">
        <p>Contact Us: info&commat;example.com &verbar; &phone; &#43;1-800-555-0199</p>
        <p>&copy; 2026 Interactive Portal. All Rights Reserved &trade;</p>
    </div>

</body>
</html>
